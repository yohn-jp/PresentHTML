<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PresentHTML presentation authoring app">
    <title>PresentHTML</title>
    <link rel="stylesheet" href="styles/app.css">
  </head>
  <body>
    <div class="app-shell" data-presenthtml-app>
      <header class="app-header">
        <p class="app-kicker">PresentHTML</p>
        <h1>Turn ideas into presentations.</h1>
        <p class="app-status" data-app-status>Authoring app ready.</p>
      </header>
      <main class="app-main" aria-label="Presentation workspace">
        <section class="workspace-placeholder" aria-labelledby="workspace-title">
          <p class="app-kicker">Workspace</p>
          <h2 id="workspace-title">Your presentation starts here.</h2>
          <p>Build and share a presentation as a standalone HTML file.</p>
        </section>
      </main>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
